{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Now</title>
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap');
</style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    
    <nav id="navbar" class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'weather:index' %}">
                <img src="{% static 'images/logo.png' %}" alt="logo" class="logo" />
                <span class="zalando">Weather Now</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">                    
                    <li class="nav-item">
                        <a class="hover nav-link" href="https://severeweather.wmo.int/" target="_blank"
                            rel="noopener">View Extreme Weather</a>
                    </li>
                    <li class="nav-item">
                        <a class="hover nav-link" href="https://github.com/hicelery/WeatherApp/" target="_blank"
                            rel="noopener">Go to Github <i class="fa-brands fa-github"></i></a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="hover nav-link" href="{% url 'account_logout'%}"><i class="fas fa-sign-out-alt"></i> Log out</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="hover nav-link" href="{% url 'account_login'%}"><i class="fas fa-sign-in-alt"></i> Log in</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    <header>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <!-- Footer -->
    <footer>
        <p class="display-4">Weather Now</p>
        <p>Powered By <a target="_blank" href="https://openweathermap.org/">OpenWeatherMap</a></p>
        <p class="small">MHW © 2026</p>
    </footer>


    <!-- Chart import JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <!--main js functionality-->
    <script src="{% static 'js/script.js' %}"></script>
    <!--collapse navbar on click-->
    <script src="{% static 'js/navbar.js' %}"></script>

    <!-- Bootstrap 5 JS (optional, if you later add interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
