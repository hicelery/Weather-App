{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center landing-container">
    <div class="row w-100 g-4">
        <!-- GitHub Option -->
        <div class="col-md-5 d-flex align-items-center justify-content-center">
            <div class="card landing-card">
                <div class="card-body text-center p-5">
                    <i class="fab fa-github landing-card-icon"></i>
                    <h2 class="zalando card-title mb-3 landing-card-title">Visit GitHub</h2>
                    <p class="card-text mb-4 landing-card-text">Check out the project source code and contribute</p>
                    <a href="https://github.com/hicelery/weather-app" target="_blank" rel="noopener noreferrer" class="btn btn-primary hover landing-card-btn">
                        Go to GitHub <i class="fas fa-external-link-alt ms-2"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="col-md-1 d-none d-md-flex align-items-center justify-content-center">
            <div style="border-left: 2px solid rgba(0,0,0,0.1); height: 80%;"></div>
        </div>

        <!-- Weather App Option -->
        <div class="col-md-5 d-flex align-items-center justify-content-center">
            <div class="card landing-card">
                <div class="card-body text-center p-5">
                    <img src="{% static 'images/weather-app-preview.png' %}" alt="Weather App Preview" class="landing-card-preview">
                    <h2 class="zalando card-title mb-3 landing-card-title">Weather App</h2>
                    <p class="card-text mb-4 landing-card-text">Enter the app and check the weather forecast</p>
                    <a href="{% url 'weather:index' %}" class="btn btn-primary hover landing-card-btn">
                        Enter App <i class="fas fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
